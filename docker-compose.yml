version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: aquastats-postgres
    environment:
      POSTGRES_DB: aquastats
      POSTGRES_USER: aquastats
      POSTGRES_PASSWORD: dev-password-change-in-prod
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=pg_stat_statements"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquastats"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aquastats

  # PgBouncer - Connection Pooling
  pgbouncer:
    image: pgbouncer:1.21
    container_name: aquastats-pgbouncer
    environment:
      PGBOUNCER_DATABASES_HOST: postgres
      PGBOUNCER_DATABASES_PORT: 5432
      PGBOUNCER_DATABASES_USER: aquastats
      PGBOUNCER_DATABASES_PASSWORD: dev-password-change-in-prod
      PGBOUNCER_DATABASES_DBNAME: aquastats
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 1000
      PGBOUNCER_DEFAULT_POOL_SIZE: 25
      PGBOUNCER_MIN_POOL_SIZE: 10
      PGBOUNCER_RESERVE_POOL_SIZE: 5
      PGBOUNCER_RESERVE_POOL_TIMEOUT: 3
      PGBOUNCER_MAX_DB_CONNECTIONS: 100
      PGBOUNCER_MAX_USER_CONNECTIONS: 100
      PGBOUNCER_SERVER_LIFETIME: 3600
      PGBOUNCER_SERVER_IDLE_TIMEOUT: 600
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aquastats

  # Redis - Sessions, Cache, Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: aquastats-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - "allkeys-lru"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aquastats

  # Mailpit - Email Testing (Dev Only)
  mailpit:
    image: axllent/mailpit:latest
    container_name: aquastats-mailpit
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: true
      MP_SMTP_AUTH_ALLOW_INSECURE: true
    networks:
      - aquastats

  # Minio - S3-compatible Object Storage (Dev Only)
  minio:
    image: minio/minio:latest
    container_name: aquastats-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"     # API
      - "9001:9001"     # Console
    volumes:
      - minio_data:/minio_root
    command: minio server /minio_root
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aquastats

  # FastAPI Backend (Optional: for local development)
  # api:
  #   build:
  #     context: ./api
  #     dockerfile: Dockerfile
  #   container_name: aquastats-api
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://aquastats:dev-password-change-in-prod@pgbouncer:6432/aquastats
  #     REDIS_URL: redis://redis:6379/0
  #     MAIL_BACKEND: smtp
  #     MAIL_HOST: mailpit
  #     MAIL_PORT: 1025
  #     AWS_S3_ENDPOINT_URL: http://minio:9000
  #     AWS_ACCESS_KEY_ID: minioadmin
  #     AWS_SECRET_ACCESS_KEY: minioadmin
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - aquastats

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  aquastats:
    driver: bridge
