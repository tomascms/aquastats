# Local development services only. Production uses Neon (Postgres) and Cloud Run.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aquastats
      POSTGRES_USER: aquastats
      POSTGRES_PASSWORD: aquastats
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquastats"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
