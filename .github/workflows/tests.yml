name: Tests
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aquastats_test
          POSTGRES_USER: aquastats
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd api
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-xdist bandit safety

      - name: Run unit tests
        working-directory: api
        env:
          DATABASE_URL: postgresql://aquastats:test@localhost:5432/aquastats_test
          REDIS_URL: redis://localhost:6379/0
          STRIPE_PUBLISHABLE_KEY: pk_test_mock
          STRIPE_SECRET_KEY: sk_test_mock
          STRIPE_WEBHOOK_SECRET: whsec_test_mock
        run: |
          pytest tests/test_validators.py -v --cov=src/app/core/validators --cov-report=term-missing

      - name: Run billing tests
        working-directory: api
        run: |
          pytest tests/test_billing.py -v --cov=src/app/domain/billing --cov-report=term-missing

      - name: Run resilience tests
        working-directory: api
        run: |
          pytest tests/test_resilience.py -v --cov=src/app/core/resilience --cov-report=term-missing

      - name: Run all tests with coverage
        working-directory: api
        env:
          DATABASE_URL: postgresql://aquastats:test@localhost:5432/aquastats_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/ -v --cov=src/app --cov-report=xml --cov-report=html

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./api/coverage.xml
          flags: unittests
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install bandit safety

      - name: Run Bandit (security linting)
        working-directory: api
        run: |
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -f txt

      - name: Check dependencies
        working-directory: api
        run: |
          pip install -r requirements.txt
          safety check --json || true
          safety check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          pip install flake8 black isort

      - name: Check code format with black
        working-directory: api
        run: |
          black --check src/ tests/ || true

      - name: Check import sorting with isort
        working-directory: api
        run: |
          isort --check-only src/ tests/ || true

      - name: Lint with flake8
        working-directory: api
        run: |
          flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203 || true
