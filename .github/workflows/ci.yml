name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (pytest + Postgres 18 + pip-audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    env:
      # Throwaway server of this job only; tests/postgres refuses any non-local host.
      TEST_ADMIN_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt

  web:
    name: Web (typegen, tsc, lint, tests, ML harness, build, npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Next 16 generates LayoutProps/PageProps; tsc fails without them.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test --if-present
      - run: npm run build
      - name: Dependency audit (production dependencies block the build)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit (development dependencies, report only)
        run: npm audit || true

  e2e:
    name: E2E (Playwright on the synthetic demo)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Local throwaway database and the demo's local-only password (apps/api/scripts/seed_synthetic.py).
      DEMO_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres
      APP_URL: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -r apps/api/requirements.txt
      - run: npm ci
        working-directory: apps/web
      - name: Synthetic team in a local database
        run: |
          python apps/api/scripts/build_local_db.py "$DEMO_ADMIN_URL" aquastats_demo
          (cd apps/web && npx tsx scripts/export-synthetic.ts --athletes 12 --seasons 2 --seed 9001 --out "$RUNNER_TEMP/synthetic.json")
          DATABASE_URL=postgresql://postgres@127.0.0.1:5432/aquastats_demo python apps/api/scripts/seed_synthetic.py "$RUNNER_TEMP/synthetic.json"
      - name: API with RLS on
        working-directory: apps/api
        env:
          APP_ENV: development
          DATABASE_ENABLE_RLS: "true"
          DATABASE_SSLMODE: disable
          DATABASE_URL: postgresql://aquastats_api@127.0.0.1:5432/aquastats_demo
          AUTH_DATABASE_URL: postgresql://aquastats_auth@127.0.0.1:5432/aquastats_demo
          SESSION_SECRET: ci-e2e-only-0123456789abcdef-0123456789abcdef
          PYTHONPATH: src
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:8000/api/v1/health && break; sleep 1; done
      - name: Site (production build)
        working-directory: apps/web
        run: |
          npm run build
          nohup npx next start -H 127.0.0.1 -p 3000 > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://127.0.0.1:3000/entrar && break; sleep 1; done
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
      - if: failure()
        run: tail -n 50 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Official image, pinned; scans every fetched commit of every branch, no token needed.
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner --log-opts="--all"
