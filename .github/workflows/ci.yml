name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (pytest + Postgres 18 + pip-audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    env:
      # Throwaway server of this job only; tests/postgres refuses any non-local host.
      TEST_ADMIN_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt

  web:
    name: Web (typegen, tsc, lint, tests, ML harness, build, npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Next 16 generates LayoutProps/PageProps; tsc fails without them.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test --if-present
      - name: ML harness smoke (tuning seeds only, decides nothing)
        run: |
          if [ -f scripts/ml-backtest.ts ]; then
            npx tsx scripts/ml-backtest.ts --predictors "mediana,v1.0 + qualidade + conformal" --seeds tune > /dev/null
          fi
      - run: npm run build
      - name: Dependency audit (production dependencies block the build)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit (development dependencies, report only)
        run: npm audit || true

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Official image, pinned; scans every fetched commit of every branch, no token needed.
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner --log-opts="--all"
