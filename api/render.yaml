# Deploy: conecta repo no Render.com (free) ou usa Blueprint deploy.
services:
  - type: web
    name: aquastats-api
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://aquastats.net
      - key: API_URL
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ORIGINS_EXTRA
        value: https://www.aquastats.net
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: MAIL_FROM
        value: confirmation@aquastats.net
      - key: CONTACT_EMAIL
        value: contact@aquastats.net
      - key: SECURITY_EMAIL
        value: security@aquastats.net
